<p style="font-family: Arial, sans-serif;"> </p>
<p style="font-family: Arial, sans-serif;"><img alt="" border="0" src="14.jpg" style=" border:none; width:100%; max-width:1024px;"/></p>
<p style="font-weight: bold; font-size: 18pt; font-family: 'Book Antiqua', serif;"> </p>
<p class="Sub_Heading">常规</p>
<ul style="list-style: disc;">
<li>
<p style="font-family: Arial, sans-serif; font-weight: bold;">Name<span style="font-weight: normal;">- 动画的名称。</span></p>
</li>
</ul>
<p style="font-family: Arial, sans-serif; font-weight: bold;"> </p>
<p class="Sub_Heading">设置</p>
<ul style="list-style: disc;">
<li>
<p style="font-family: Arial, sans-serif; font-weight: normal;">
<span style="font-weight: bold;">图形</span>-  动画的文件。<br/>
<span style="font-weight: bold;"><img alt="Created and Owned by Archeia" border="0" src="ANIMATIONSHEET.jpg" style=" border:none; width:100%; max-width:194px;" title="Created and Owned by Archeia"/></span>
</p>
</li>
<li>
<p style="font-family: Arial, sans-serif; font-weight: bold;">Frame Grid<span style="font-weight: normal;">- 每行 (X) 和每列 (Y) 的帧数。</span></p>
</li>
<li>
<p style="font-family: Arial, sans-serif; font-weight: bold;">Frame Range<span style="font-weight: normal;">-
	动画从 0 到最大值的帧数。如果有 30 帧，则范围是 0~29。</span></p>
</li>
<li>
<p style="font-family: Arial, sans-serif; font-weight: normal;"><span style="font-weight: bold;">Repetition Range</span>- 循环动画的起始帧和结束帧。</p>
</li>
<li>
<p style="font-family: Arial, sans-serif; font-weight: normal;"><span style="font-weight: bold;">Duration</span>- 动画的长度。</p>
</li>
<li>
<p style="font-family: Arial, sans-serif; font-weight: normal;"><span style="font-weight: bold;">Repeats</span>- 如果勾选，动画将循环播放。</p>
</li>
</ul>
<p style="font-family: Arial, sans-serif; font-weight: bold;"> </p>
