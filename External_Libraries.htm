<p class="Topic_Heading">外部库</p>
<p> </p>
<p>Visual Novel Maker 允许您添加任何外部第三方 JavaScript 库，如果您在游戏中需要它们。</p>
<p> </p>
<p>如果您想添加外部库，只需导航到您的项目文件夹，在那里创建一个名为“lib”的新文件夹，并将所有外部库放入其中。所有外部库都会在实际游戏脚本之前自动包含。</p>
<p> </p>
<p class="SubSubHeading">重要提示</p>
<p> </p>
<p>请记住，如果您添加任何外部库，您的游戏可能会失去可移植性，因为这些库可能在所有平台上都不可用。特别是如果您的库操作 HTML5 API，因为如果这些 API 在特定目标平台上不可用，您的游戏在那里可能无法运行。</p>
<p> </p>
